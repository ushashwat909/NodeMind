[build]
  command = "npm ci --include=dev --prefix client && npm ci --include=dev --prefix server && npm run build"
  publish = "client/dist"

[[redirects]]
  from = "/api/*"
  to = "https://nodemind.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


